name: ci_pipeline

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

  steps:
    - name: Checkout_code
      uses: action/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Intall dependencies
      run: npm install

    - name: Run tests
      run: npm test
